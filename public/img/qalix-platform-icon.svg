<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sovereignBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="45%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#0B389E"/>
    </linearGradient>

    <radialGradient id="auraGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Radiant Squircle Base (Pure Symbol, Zero Text) -->
  <rect width="512" height="512" rx="108" fill="url(#sovereignBg)"/>
  <circle cx="256" cy="256" r="220" fill="url(#auraGlow)"/>

  <!-- Precision Borders -->
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.95"/>
  <rect width="494" height="494" x="9" y="9" rx="99" fill="none" stroke="#BAE6FD" stroke-width="2" opacity="0.6"/>

  <!-- Fortress Shield (Centered) -->
  <g transform="translate(256, 256) scale(1.18)">
    <!-- Outer Fortress Battlements -->
    <path d="M -90 -95 
             L -55 -95 L -55 -78 L -30 -78 L -30 -95 
             L 30 -95 L 30 -78 L 55 -78 L 55 -95 
             L 90 -95 
             L 90 15 
             C 90 85 45 125 0 145 
             C -45 125 -90 85 -90 15 Z" 
          fill="#FFFFFF" 
          stroke="url(#goldRim)" 
          stroke-width="7" 
          stroke-linejoin="round"
          filter="url(#shadowGlow)"/>

    <!-- Inner Core Shield -->
    <path d="M -72 -68 
             L 72 -68 
             L 72 10 
             C 72 65 36 98 0 118 
             C -36 98 -72 65 -72 10 Z" 
          fill="#0284C7" 
          stroke="#BAE6FD" 
          stroke-width="2.5"
          opacity="0.98"/>

    <!-- Cyber Vault Padlock -->
    <!-- Shackle -->
    <path d="M -22 -15 V -38 C -22 -56 22 -56 22 -38 V -15" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="9" 
          stroke-linecap="round"/>
    <!-- Lock Body -->
    <rect x="-35" y="-18" width="70" height="58" rx="12" fill="url(#goldRim)" filter="url(#shadowGlow)"/>
    <rect x="-29" y="-12" width="58" height="46" rx="8" fill="#FFFFFF"/>
    <!-- Keyhole -->
    <circle cx="0" cy="5" r="5.5" fill="#0284C7"/>
    <path d="M -3.5 8 L -5 22 H 5 L 3.5 8 Z" fill="#0284C7"/>

    <!-- Apex Golden Star -->
    <polygon points="0,-115 5,-102 18,-102 8,-93 12,-80 0,-89 -12,-80 -8,-93 -18,-102 -5,-102" fill="url(#goldRim)"/>
  </g>
</svg>
