<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060C16"/>
      <stop offset="100%" stop-color="#0A1526"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Platinum Shield Gradient -->
    <linearGradient id="platGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean Obsidian Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1198" height="398" x="1" y="1" rx="19" fill="none" stroke="#162A45" stroke-width="1.5"/>

  <!-- ==================== MINIMALIST ICONIC EMBLEM ==================== -->
  <g transform="translate(70, 45)">

    <!-- Ambient Subtle Glow -->
    <circle cx="155" cy="155" r="110" fill="#0284C7" opacity="0.12" filter="url(#glow)"/>

    <!-- Outer Sovereign Shield Frame -->
    <path d="M 50 40 
             L 100 40 L 100 65 L 130 65 L 130 40 
             L 180 40 L 180 65 L 210 65 L 210 40 
             L 260 40 
             L 260 170 
             C 260 240 200 285 155 305 
             C 110 285 50 240 50 170 Z" 
          fill="#0B1A2E" 
          stroke="url(#cyanGrad)" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Inner Armored Core Shield -->
    <path d="M 75 75 
             L 235 75 
             L 235 165 
             C 235 220 190 255 155 272 
             C 120 255 75 220 75 165 Z" 
          fill="#07111E" 
          stroke="#1E3A5F" 
          stroke-width="2.5"/>

    <!-- Central Precision Vault Lock (Keyhole & Shackle) -->
    <!-- Shackle -->
    <path d="M 132 125 V 105 C 132 92 178 92 178 105 V 125" 
          fill="none" 
          stroke="url(#platGrad)" 
          stroke-width="7" 
          stroke-linecap="round"/>
    <!-- Padlock Body -->
    <rect x="116" y="122" width="78" height="66" rx="12" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <rect x="122" y="128" width="66" height="54" rx="8" fill="#060E1A"/>
    <!-- Precision Keyhole -->
    <circle cx="155" cy="148" r="6" fill="url(#platGrad)"/>
    <path d="M 152 152 L 150 166 H 160 L 158 152 Z" fill="url(#platGrad)"/>

    <!-- 4 Geometric Sovereign Nodes (Subtle, Minimalist Points of Strength) -->
    <circle cx="155" cy="225" r="4" fill="#38BDF8"/>
    <circle cx="115" cy="205" r="3.5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="195" cy="205" r="3.5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="155" cy="245" r="3" fill="#38BDF8" opacity="0.6"/>

  </g>

  <!-- Vertical Divider -->
  <line x1="420" y1="65" x2="420" y2="335" stroke="#162A45" stroke-width="1.5"/>

  <!-- ==================== CLEAN LUXURY TYPOGRAPHY ==================== -->
  <g transform="translate(470, 75)">

    <!-- Primary Brand Name: Q A L I X -->
    <text x="0" y="115" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif" 
          font-weight="900" 
          font-size="118" 
          letter-spacing="12" 
          fill="#FFFFFF">
      QALI<tspan fill="url(#cyanGrad)">X</tspan>
    </text>

    <!-- Arabic Title: كـالـكـس -->
    <text x="0" y="195" 
          font-family="'Cairo', Tahoma, sans-serif" 
          font-weight="900" 
          font-size="44" 
          fill="#F1F5F9">
      كَـالَـكْـس <tspan fill="#38BDF8" font-size="34">·</tspan> <tspan font-size="34" font-weight="700" fill="#94A3B8">قلعتك الرقمية السيادية</tspan>
    </text>

    <!-- Subtitle / Doctrine -->
    <text x="0" y="245" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-weight="700" 
          font-size="14.5" 
          letter-spacing="4" 
          fill="#38BDF8">
      SOVEREIGN COMPUTING · AIR-GAPPED RESILIENCE
    </text>

  </g>

</svg>
